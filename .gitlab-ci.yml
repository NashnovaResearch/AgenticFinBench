image: python:3.12-slim

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

benchmark-offline:
  stage: test
  script:
    - python -m pip install -r requirements.txt
    - python -m unittest discover -s tests -v
    - python -m benchmark --answers examples/one-answer.jsonl --out results/ci-check --check
  artifacts:
    when: always
    paths:
      - results/ci-check/manifest.json
    expire_in: 7 days
