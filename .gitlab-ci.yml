include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  AST_ENABLE_MR_PIPELINES: "true"

image: python:3.12-slim

stages:
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

benchmark-offline:
  stage: test
  script:
    - python -m pip install -r requirements.txt
    - python -m unittest discover -s tests -v
    - python -m benchmark --answers examples/one-answer.jsonl --out results/ci-check --check
  artifacts:
    when: always
    paths:
      - results/ci-check/manifest.json
    expire_in: 7 days

site-build:
  stage: test
  script:
    - python scripts/build_site.py
  artifacts:
    paths:
      - public/
    expire_in: 30 days

# Enable this project variable after the instance administrator configures Pages.
# The build artifact remains available even on instances without GitLab Pages.
deploy-pages:
  stage: deploy
  needs:
    - job: site-build
      artifacts: true
  script:
    - test -s public/index.html
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_GITLAB_PAGES == "true"'
